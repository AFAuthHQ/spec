name: Notify docs of spec update

# When normative spec content lands on main, ping AFAuthHQ/docs to run its
# sync-spec workflow immediately, instead of waiting for the reconcile cron.
#
# DORMANT until the dispatch GitHub App is configured: the job is gated on
# the `DOCS_SYNC_APP_ID` repo variable, so until you set it this workflow is
# a no-op (skipped, never failed). To activate:
#   1. Create a GitHub App with "Contents: read and write" on AFAuthHQ/docs,
#      install it on the docs repo.
#   2. In THIS repo (spec): set variable DOCS_SYNC_APP_ID = the App's ID, and
#      secret DOCS_SYNC_APP_KEY = the App's private key (.pem contents).
on:
  push:
    branches: [main]
    paths: # only when content the docs site mirrors actually changes
      - "spec/**"
      - "schemas/**"
      - "vectors/**"

# Only the latest push needs to notify; cancel any superseded run.
concurrency:
  group: notify-docs
  cancel-in-progress: true

permissions:
  issues: write # for the failure handler only (GITHUB_TOKEN is unused otherwise)

jobs:
  notify:
    # Inert until the App is configured. `vars` (unlike `secrets`) is allowed in `if`.
    if: ${{ vars.DOCS_SYNC_APP_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint a docs-scoped installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_KEY }}
          owner: AFAuthHQ
          repositories: docs

      - name: Dispatch spec-updated → AFAuthHQ/docs
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: AFAuthHQ/docs
          event-type: spec-updated # matches docs sync-spec.yml repository_dispatch type

      # Failing to notify isn't fatal (the docs reconcile cron still catches up),
      # but it should be visible. Idempotent: one open issue, no spam.
      - name: Surface failure as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = "sync-broken";
            const { owner, repo } = context.repo;
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `Failed to notify AFAuthHQ/docs of a spec update (docs will sync late via cron).\n\n${url}`;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: label, per_page: 1,
            });
            if (open.data.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: "Spec → docs notify is failing", body, labels: [label] });
            }
